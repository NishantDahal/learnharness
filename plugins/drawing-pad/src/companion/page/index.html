<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>LearnHarness Drawing</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar" role="toolbar" aria-label="Drawing tools">
    <div class="group">
      <button id="tool-pen" class="tool" type="button" aria-label="Pen" title="Pen" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 3 5 5M4 20l4-1L21 6a2.12 2.12 0 0 0-3-3L5 16z"/></svg>
      </button>
      <button id="tool-eraser" class="tool" type="button" aria-label="Eraser (removes whole strokes)" title="Eraser" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 13 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-9 9H7l-3-3a3 3 0 0 1 0-4Z"/><path d="m9 8 7 7M11 20h10"/></svg>
      </button>
    </div>
    <div class="group sizes" role="group" aria-label="Brush size">
      <button class="size" type="button" data-size="0.5" aria-pressed="false"><span class="dot-0"></span></button>
      <button class="size" type="button" data-size="1" aria-pressed="true"><span class="dot-1"></span></button>
      <button class="size" type="button" data-size="2" aria-pressed="false"><span class="dot-2"></span></button>
      <button class="size" type="button" data-size="4" aria-pressed="false"><span class="dot-3"></span></button>
    </div>
    <div class="group">
      <button id="undo" class="tool" type="button" aria-label="Undo" title="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h6M3 10V4M3 10a9 9 0 1 1 2 9"/></svg>
      </button>
      <button id="redo" class="tool" type="button" aria-label="Redo" title="Redo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10h-6M21 10V4M21 10a9 9 0 1 0-2 9"/></svg>
      </button>
      <button id="clear" class="tool text" type="button" disabled>Clear</button>
    </div>
    <div class="group end">
      <span id="sheet-label" class="label"></span>
      <button id="finger" class="tool" type="button" aria-label="Draw with finger" title="Draw with finger (off after Apple Pencil is used)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v3M17 12a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3-2l2 2"/></svg>
      </button>
      <button id="fit" class="tool" type="button" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="theme" class="tool" type="button" aria-label="Ink color" title="Ink: auto / black / white">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" class="fill"/></svg>
      </button>
      <span class="status" role="status" aria-live="polite"><span id="status-dot" class="dot" data-state="connecting"></span><span id="status-text">Connecting…</span></span>
    </div>
  </header>
  <main id="surface" class="surface" aria-label="Drawing canvas. Use Apple Pencil to draw; use fingers to move the view.">
    <img id="reference" class="reference" alt="Question reference from LearnHarness" draggable="false" hidden>
    <canvas id="ink" class="layer"></canvas>
    <canvas id="active" class="layer"></canvas>
    <div id="message" class="message" hidden>
      <p id="message-text"></p>
      <button id="message-action" class="tool text" type="button" hidden></button>
    </div>
    <div id="toast" class="toast" role="alert" hidden></div>
  </main>
  <dialog id="confirm-clear" class="confirm">
    <form method="dialog">
      <p>Clear the whole drawing on the iPad and in LearnHarness? This cannot be undone.</p>
      <div class="actions">
        <button value="cancel" class="tool text" type="submit" autofocus>Cancel</button>
        <button value="clear" class="tool text danger" type="submit">Clear drawing</button>
      </div>
    </form>
  </dialog>
</body>
</html>
